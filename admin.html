<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Story — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0509;color:#ffeef4;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:30px 18px}h1,h2{font-family:Georgia,serif}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:#ffffff08;border:1px solid #ffffff15;border-radius:22px;padding:24px;margin:18px 0}input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff1f;background:#fff;color:#24101a;margin:7px 0 15px;font:inherit}textarea{min-height:260px}.btn{padding:12px 18px;border:0;border-radius:11px;background:#e84883;color:#fff;font-weight:bold;cursor:pointer;margin:4px}.danger{background:#74223e}.ghost{background:#ffffff12}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:10px;margin:5px}.item{padding:18px;border:1px solid #ffffff12;border-radius:16px;margin:10px 0}.muted{color:#bd9eaa;font-size:13px}.login{max-width:430px;margin:12vh auto}.hidden{display:none}.status{min-height:20px;color:#ff9bbb;font-size:13px}.ok{color:#9ff0c0}@media(max-width:700px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="card login"><h1>Private Admin ❤️</h1><p class="muted">Sign in to manage your story from any device.</p><input id="ae" type="email" placeholder="Admin email"><input id="ap" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Open Admin</button><p id="msg" class="status"></p><p class="muted">First time? Create the admin user in Supabase Authentication, then use that email and password here.</p></div>
<div id="app" class="wrap hidden"><div class="top"><div><h1>Our Story — Admin</h1><p id="who" class="muted">Build the memories whenever you want.</p></div><div><button class="btn ghost" onclick="location.href='index.html'">View Website</button><button class="btn danger" onclick="logout()">Logout</button></div></div>
<div class="card"><h2 id="heading">New Chapter</h2><div class="row"><div><label>Chapter title</label><input id="title" placeholder="Example: The Day We Met Again"></div><div><label>Order</label><input id="order" type="number" min="1" value="1"></div></div>
<label>Story</label><textarea id="text" placeholder="Write your memory here. Use a blank line between paragraphs."></textarea>
<label>Add photos</label><input id="files" type="file" accept="image/*" multiple><div id="thumbs" class="thumbs"></div>
<button class="btn" onclick="save()">Save Chapter ❤️</button><button class="btn ghost" onclick="resetForm()">Clear</button><p id="status" class="status"></p></div>
<div class="card"><h2>Chapters</h2><div id="list"><p class="muted">Loading...</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 1) Create a free Supabase project. 2) Paste your Project URL and anon/publishable key below.
const SUPABASE_URL='https://pqgffymzadhorelndatz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_LmD7Q941pKqY6gqFHjjz3w_2OOxxtR_';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let editId=null,photos=[];
const $=id=>document.getElementById(id);
function configured(){return !SUPABASE_URL.includes('PASTE_')&&!SUPABASE_ANON_KEY.includes('PASTE_')}
function setMsg(t,ok=false){$('msg').textContent=t;$('msg').className='status'+(ok?' ok':'')}
function setStatus(t,ok=false){$('status').textContent=t;$('status').className='status'+(ok?' ok':'')}
async function login(){if(!configured())return setMsg('Add your Supabase URL and anon key in admin.html first.');setMsg('Signing in...');const {data,error}=await sb.auth.signInWithPassword({email:$('ae').value.trim(),password:$('ap').value});if(error)return setMsg(error.message);await openApp(data.user)}
async function logout(){await sb.auth.signOut();location.reload()}
async function openApp(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Signed in as '+user.email;await list();resetForm()}
async function init(){if(!configured())return;if(new URLSearchParams(location.search).has('signedout'))return;const {data}=await sb.auth.getSession();if(data.session)openApp(data.session.user)}
$('files').onchange=async e=>{photos=[];for(const f of e.target.files){if(f.size>8*1024*1024){setStatus(f.name+' is larger than 8 MB and was skipped.');continue}photos.push({file:f,preview:await read(f),caption:f.name})}showPhotos()}
function read(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
function showPhotos(){$('thumbs').innerHTML=photos.map(p=>`<img src="${p.preview||p.url}" alt="">`).join('')}
async function uploadPhotos(chapterId){let out=[];for(const p of photos){if(!p.file){out.push({url:p.url,caption:p.caption||''});continue}const ext=(p.file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${chapterId}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('story-photos').upload(path,p.file,{upsert:false,contentType:p.file.type||'image/jpeg'});if(error)throw error;const {data}=sb.storage.from('story-photos').getPublicUrl(path);out.push({url:data.publicUrl,caption:p.caption||p.file.name})}return out}
async function save(){let title=$('title').value.trim(),text=$('text').value.trim();if(!title||!text)return setStatus('Add title and story first.');setStatus('Saving...');try{if(editId){const {data:old,error:e}=await sb.from('chapters').select('photos').eq('id',editId).single();if(e)throw e;const chapterPhotos=await uploadPhotos(editId);const finalPhotos=photos.some(p=>p.file)?chapterPhotos:(photos.length?chapterPhotos:(old.photos||[]));const {error}=await sb.from('chapters').update({title,text,sort_order:+$('order').value||1,photos:finalPhotos}).eq('id',editId);if(error)throw error}else{const id=crypto.randomUUID();const chapterPhotos=await uploadPhotos(id);const {error}=await sb.from('chapters').insert({id,title,text,sort_order:+$('order').value||1,photos:chapterPhotos});if(error)throw error}await list();resetForm();setStatus('Saved online ❤️',true)}catch(e){console.error(e);setStatus(e.message||'Could not save.')}}
async function list(){const {data,error}=await sb.from('chapters').select('*').order('sort_order',{ascending:true});if(error){$('list').innerHTML='<p class="status">'+esc(error.message)+'</p>';return}$('list').innerHTML=(data||[]).map(x=>`<div class="item"><b>Chapter ${x.sort_order} — ${esc(x.title)}</b><p class="muted">${esc(x.text).slice(0,180)}${x.text.length>180?'...':''}</p><span class="muted">${(x.photos||[]).length} photo(s)</span><br><button class="btn" onclick="edit('${x.id}')">Edit</button><button class="btn danger" onclick="del('${x.id}')">Delete</button></div>`).join('')||'<p class="muted">No chapters yet.</p>'}
async function edit(id){const {data:x,error}=await sb.from('chapters').select('*').eq('id',id).single();if(error)return setStatus(error.message);editId=id;$('heading').textContent='Edit Chapter';$('title').value=x.title;$('order').value=x.sort_order;$('text').value=x.text;photos=(x.photos||[]).map(p=>({url:p.url,caption:p.caption||''}));showPhotos();scrollTo(0,0)}
async function del(id){if(!confirm('Delete this chapter?'))return;setStatus('Deleting...');const {data:x}=await sb.from('chapters').select('photos').eq('id',id).single();if(x?.photos?.length){for(const p of x.photos){try{const u=new URL(p.url);const marker='/storage/v1/object/public/story-photos/';const path=u.pathname.split(marker)[1];if(path)await sb.storage.from('story-photos').remove([path])}catch(e){console.warn(e)}}}const {error}=await sb.from('chapters').delete().eq('id',id);if(error)return setStatus(error.message);await list();resetForm();setStatus('Deleted.',true)}
function resetForm(){editId=null;photos=[];$('heading').textContent='New Chapter';$('title').value='';$('order').value=1;$('text').value='';$('files').value='';$('thumbs').innerHTML='';setStatus('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
init();
</script></body></html>
